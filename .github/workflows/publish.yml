# Release: STAGE @bixel/verify on npm with trusted publishing (OIDC, no token; npm >= 11.5.1).
# The staged version goes live only after a maintainer approves it on npmjs.com
# (or `npm stage approve` with 2FA) — the trusted publisher allows stage only.
# Trigger: a GitHub release, or the manual button. npm must list this repo +
# this workflow file as the package's trusted publisher (npmjs.com → package →
# Settings → Trusted Publisher: bixel-ai/bixel-verify, publish.yml).
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: node bin/bixel-verify.mjs --self-test
      - run: npm stage publish --access public --provenance
